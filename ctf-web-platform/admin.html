<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Cyber CTF</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="topbar"><div class="brand">Cyber<span>CTF</span></div><nav><a href="index.html">Home</a><a href="challenges.html">Desafios</a><a href="ranking.html">Ranking</a><a href="admin.html">Admin</a></nav></header>
  <main class="container admin-layout">
    <section class="panel">
      <h1>Cadastrar Desafio</h1>
      <p>Nesta versão inicial, os dados ficam no navegador usando LocalStorage.</p>
      <form id="challengeForm">
        <label>Título</label><input id="title" required />
        <label>Categoria</label><input id="category" placeholder="Windows Logs, PCAP, Web..." required />
        <label>Dificuldade</label><select id="difficulty"><option>Fácil</option><option>Médio</option><option>Difícil</option></select>
        <label>Pontos</label><input id="points" type="number" value="100" required />
        <label>Descrição</label><textarea id="description" rows="5" required></textarea>
        <label>Flag</label><input id="flag" placeholder="CTF{minha_flag}" required />
        <button class="btn primary" type="submit">Salvar Desafio</button>
      </form>
    </section>
    <section class="panel"><h2>Desafios cadastrados</h2><div id="adminChallengeList"></div></section>
  </main>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
